[project]
name = "ocop-packaging-orchestrator"
version = "0.1.0"
description = "Deterministic full-spread OCOP packaging core"
readme = "README.md"
authors = [
    { name = "WHT413", email = "haryqvs@outlook.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2.6",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "reportlab>=5.0.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "typer>=0.26.7",
]

[project.scripts]
ocop-pack = "ocop_pack.cli.app:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ocop_pack"

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "mypy>=2.1.0",
    "pymupdf>=1.27.2.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ocop_pack"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ocop_pack --cov-report=term-missing --cov-fail-under=80 --cov-config=pyproject.toml"
markers = [
    "real_ai: tests that call configured sandbox AI providers and may cost money",
    "provider_sandbox: opt-in provider sandbox tests that may spend one bounded API call",
]

[tool.coverage.run]
source = ["src/ocop_pack"]
omit = [
    "src/ocop_pack/cli/*",
    "src/ocop_pack/infrastructure/logging.py",
]
